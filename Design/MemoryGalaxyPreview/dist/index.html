<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080711">
  <title>我们的星河 · 记忆预览</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="universe" aria-label="记忆星河，匿名示例预览">
    <canvas id="sky" aria-hidden="true"></canvas>
    <canvas id="galaxy" aria-hidden="true"></canvas>
    <canvas id="light" aria-hidden="true"></canvas>
    <div id="star-targets" aria-label="点亮的记忆"></div>
    <header class="heading">
      <div class="heading-row"><h1>记忆</h1><button class="icon-button" id="menu-toggle" aria-label="星河设置" aria-expanded="false" aria-controls="settings"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></div>
      <p class="script">A small universe of us</p>
      <p class="subheading">十月的星河 <span>·</span> <span id="memory-count">9 颗记忆</span></p>
      <nav id="categories" class="categories" aria-label="记忆分类"></nav>
    </header>
    <section id="settings" class="popover" aria-label="星河设置" hidden>
      <button id="motion-toggle" aria-pressed="false">暂停星河动态</button>
      <button id="meteor-trigger">看一颗流星</button>
      <button id="zoom-in">拉近星河</button>
      <button id="zoom-out">拉远星河</button>
      <button id="reset-camera">回到最初视角</button>
      <p id="data-source">匿名示例预览 · 未连接真实记忆</p>
    </section>
    <p class="sky-note" aria-hidden="true">每个被记住的瞬间<br>都有自己的光</p>
    <p id="empty-memory" class="empty-memory" role="status" hidden></p>
    <footer class="foot">
      <p id="gesture-hint">轻拖漫游 · 双指拉近 · 点亮星读记忆</p>
      <div class="foot-row"><span id="preview-label" class="preview-label">匿名示例</span><button id="list-open">查看 9 颗记忆 <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div>
    </footer>
    <div id="notice" role="status" class="notice"></div>
    <section id="memory-card" class="memory-card" role="dialog" aria-modal="true" aria-labelledby="memory-title" hidden>
      <div class="card-top"><span id="memory-category"></span><button class="icon-button" id="memory-close" aria-label="收起记忆"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <h2 id="memory-title"></h2>
      <p id="memory-body"></p>
      <blockquote id="memory-quote"></blockquote>
      <div class="card-date"><span id="memory-date"></span><span id="memory-origin">示例记忆</span></div>
      <button id="love-toggle" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 20S3 14.5 3 8.5A4.5 4.5 0 0112 7a4.5 4.5 0 019 1.5C21 14.5 12 20 12 20z"/></svg><span>这颗我很喜欢</span></button>
      <div class="memory-navigation"><button id="memory-prev">上一颗</button><span id="memory-order"></span><button id="memory-next">下一颗</button></div>
    </section>
    <section id="memory-list" class="memory-list" role="dialog" aria-modal="true" aria-labelledby="list-title" hidden>
      <div class="card-top"><h2 id="list-title">十月，记住的瞬间</h2><button class="icon-button" id="list-close" aria-label="收起记忆列表"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <p id="list-note">以下为匿名示例，不是你的真实记忆。</p><div id="list-items"></div>
    </section>
    <div id="render-error" class="render-error" hidden><p>星河暂时没能亮起来。</p><p>请重新打开页面，或先从下方列表查看记忆。</p></div>
    <noscript><p class="render-error">需要启用 JavaScript 才能漫游星河。</p></noscript>
  </main>
  <script type="module" src="app.mjs"></script>
</body>
</html>

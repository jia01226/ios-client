<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>星图 · 更斜的花体</title>
<style>
@font-face{font-family:Monsieur;src:url('assets/MonsieurLaDoulaise-Regular.ttf');font-display:swap}
@font-face{font-family:Pinyon;src:url('assets/PinyonScript-Regular.ttf');font-display:swap}
@font-face{font-family:WindSong;src:url('assets/windsong.ttf');font-display:swap}
*{box-sizing:border-box}html{color-scheme:dark;background:#05070d;color:#eeedf2;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}body{margin:0}main{max-width:480px;margin:auto;padding:26px 24px}h1{font-family:'Songti SC',serif;font-size:23px;font-weight:400;margin:0 0 12px;letter-spacing:.08em}header p{font-size:12px;line-height:1.8;color:#bfc2cf;margin:0 0 24px}.option{display:block;width:100%;border:0;border-top:1px solid #292c38;padding:17px 0 15px;background:transparent;color:inherit;text-align:left;cursor:pointer}.label{display:flex;justify-content:space-between;gap:8px;font-size:11px;line-height:1.6;color:#c5c4d0}.label b{font-weight:400;color:#ecd5df;margin-right:9px;font-variant-numeric:tabular-nums}.specimen{padding:12px 14px 0;overflow:visible}.sample,.detail{display:block;font-size:35px;line-height:1.7;font-weight:400;white-space:nowrap;transform-origin:left center;transform:skewX(var(--slant)) scaleX(.9);letter-spacing:0}.detail{font-size:52px;line-height:1.45;padding-left:6px}.a{font-family:Monsieur,cursive;--slant:-18deg}.b{font-family:Pinyon,cursive;--slant:-16deg}.c{font-family:WindSong,cursive;--slant:-20deg}.option:focus-visible{outline:1px solid #e6cfdb;outline-offset:3px}.option[aria-pressed=true]{background:#b9b3cb0c}.option[aria-pressed=true] .label{color:#f1d4dd}footer{border-top:1px solid #292c38;padding-top:15px;color:#bfc2cf;font-size:12px;line-height:1.8}footer p{margin:0 0 6px}a{color:#e2d3df;text-underline-offset:4px}::selection{background:#655768;color:white}@media(max-width:500px){.sample{font-size:29px}.detail{font-size:43px}}@media(max-width:350px){main{padding:22px 20px}.sample{font-size:26px}.detail{font-size:38px}.specimen{padding-left:12px;padding-right:12px}}
</style></head><body><main>
<header><h1>更斜，也更花一点</h1><p>这次保留卷花和连笔，再加大右倾角度。<br>看整句的感觉，也看看大写字母的尾笔。</p></header>
<div aria-label="更斜的花体对照">
<button class="option" aria-pressed="false" data-number="14"><span class="label"><span><b>14</b>卷花长笔</span><span>02 的花体 · 再加斜</span></span><span class="specimen"><span class="sample a">A small universe of us</span><span class="detail a">Moonlight</span></span></button>
<button class="option" aria-pressed="false" data-number="15"><span class="label"><span><b>15</b>古典细弧</span><span>Pinyon · 再加斜</span></span><span class="specimen"><span class="sample b">A small universe of us</span><span class="detail b">Moonlight</span></span></button>
<button class="option" aria-pressed="false" data-number="16"><span class="label"><span><b>16</b>舒展细线</span><span>WindSong · 再加斜</span></span><span class="specimen"><span class="sample c">A small universe of us</span><span class="detail c">Moonlight</span></span></button>
</div><footer><p id="choice" role="status">先挑笔画和倾斜感，星图暂不替换。</p><a href="fonts-light.html">回看上一组</a></footer>
</main><script>const options=[...document.querySelectorAll('.option')];options.forEach(button=>button.addEventListener('click',()=>{options.forEach(option=>option.setAttribute('aria-pressed',String(option===button)));document.getElementById('choice').textContent=`已标记 ${button.dataset.number}，尚未应用。`;}));</script></body></html>

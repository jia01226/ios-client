<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>星图 · 细线与斜体</title>
<style>
@font-face{font-family:WindSong;src:url('assets/windsong.ttf');font-weight:400;font-display:swap}
@font-face{font-family:DeHaviland;src:url('assets/mrdehaviland.ttf');font-weight:400;font-display:swap}
@font-face{font-family:Cormorant;src:url('assets/cormorantgaramond.ttf');font-style:italic;font-weight:300 700;font-display:swap}
@font-face{font-family:Newsreader;src:url('assets/newsreader.ttf');font-style:italic;font-weight:200 800;font-display:swap}
*{box-sizing:border-box}html{background:#05070d;color:#eeedf2;color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}body{margin:0}main{max-width:480px;margin:auto;padding:26px 24px}h1{font-family:'Songti SC',serif;font-size:23px;letter-spacing:.08em;font-weight:400;margin:0 0 12px}header p{font-size:12px;line-height:1.8;color:#bfc2cf;margin:0 0 20px}.option{display:block;width:100%;cursor:pointer;background:transparent;text-align:left;color:inherit;border:0;border-top:1px solid #292c38;padding:15px 0 12px}.label{display:flex;justify-content:space-between;gap:8px;font-size:11px;line-height:1.6;color:#c5c4d0}.label b{font-weight:400;color:#ecd5df;font-variant-numeric:tabular-nums;margin-right:8px}.sample{display:block;font-size:36px;line-height:1.65;white-space:nowrap;letter-spacing:0;color:#eeedf2}.detail{display:block;font-size:43px;line-height:1.3;margin-bottom:2px;color:#eeedf2}.hand-one{font-family:WindSong,cursive;font-weight:400}.hand-two{font-family:DeHaviland,cursive;font-weight:400}.italic-one{font-family:Cormorant,serif;font-style:italic;font-weight:300}.italic-two{font-family:Newsreader,serif;font-style:italic;font-weight:200;font-optical-sizing:auto}.option[aria-pressed=true]{background:#b9b3cb0c}.option[aria-pressed=true] .label{color:#f1d4dd}.option:focus-visible{outline:1px solid #e6cfdb;outline-offset:3px}footer{border-top:1px solid #292c38;padding-top:13px;font-size:12px;line-height:1.8;color:#bfc2cf}footer p{margin:0 0 6px}a{color:#e2d3df;text-underline-offset:4px}::selection{background:#655768;color:white}@media(max-width:500px){.sample{font-size:29px}.detail{font-size:38px}.option{padding:12px 0 8px}}@media(max-width:350px){main{padding:22px 20px}.sample{font-size:26px}.detail{font-size:34px}}
</style></head><body><main>
<header><h1>更细一点，更斜一点</h1><p>10、11 保留连笔；12、13 是细衬线斜体。<br>同色对照，不靠调暗把笔画变细。</p></header>
<div aria-label="细花体与斜体对照">
<button class="option" aria-pressed="false" data-number="10" data-name="WindSong"><span class="label"><span><b>10</b>WindSong</span><span>细线 · 连笔</span></span><span class="sample hand-one">A small universe of us</span><span class="detail hand-one">Moonlight</span></button>
<button class="option" aria-pressed="false" data-number="11" data-name="Mr De Haviland"><span class="label"><span><b>11</b>Mr De Haviland</span><span>舒展 · 手写</span></span><span class="sample hand-two">A small universe of us</span><span class="detail hand-two">Moonlight</span></button>
<button class="option" aria-pressed="false" data-number="12" data-name="Cormorant Garamond Light Italic"><span class="label"><span><b>12</b>Cormorant Garamond</span><span>Light Italic</span></span><span class="sample italic-one">A small universe of us</span><span class="detail italic-one">Moonlight</span></button>
<button class="option" aria-pressed="false" data-number="13" data-name="Newsreader ExtraLight Italic"><span class="label"><span><b>13</b>Newsreader</span><span>ExtraLight Italic</span></span><span class="sample italic-two">A small universe of us</span><span class="detail italic-two">Moonlight</span></button>
</div>
<footer><p id="choice" role="status">喜欢哪一种笔画？选好再应用到星图。</p><a href="fonts-between.html">回看上一组</a></footer>
</main><script>const options=[...document.querySelectorAll('.option')];options.forEach(button=>button.addEventListener('click',()=>{options.forEach(option=>option.setAttribute('aria-pressed',String(option===button)));document.getElementById('choice').textContent=`已标记 ${button.dataset.number} · ${button.dataset.name}，尚未应用。`;}));</script></body></html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水畔 · 漫游录像核对</title><style>body{font:16px/1.7 system-ui;margin:24px auto;padding:0 20px;max-width:850px;background:#edeaf0;color:#30384b}h1{font-size:24px}video{display:block;max-width:100%;max-height:70vh;margin:20px 0;background:#30384b}button,a{font:inherit;color:inherit;margin:5px;padding:10px}button{border:1px solid #aaa3b5;border-radius:8px;background:#fff}p{max-width:65ch}:focus-visible{outline:2px solid #8f5367;outline-offset:3px}</style></head><body><h1>水畔 · 20 秒漫游</h1><p>网页画布实时录制，脚本驱动镜头。匿名示例，不是真机录屏。卡片文字为同源同步绘制，实际界面见截图。</p><video id="video" controls playsinline preload="metadata" src="/review/walkthrough-20s.webm"></video><p id="meta" role="status">正在读取录像…</p><button data-time="0">开头</button><button data-time="6">抬头看月亮</button><button data-time="12">蝴蝶与记忆</button><button data-time="19">返回水边</button><p><a href="/">回到交互预览</a></p><script>const v=document.querySelector('video');v.onloadedmetadata=()=>{document.querySelector('#meta').textContent=`画面 ${v.videoWidth} × ${v.videoHeight} · ${Number.isFinite(v.duration)?v.duration.toFixed(1)+' 秒':'流式 WebM，时长见 capture.json'}`};v.onerror=()=>{document.querySelector('#meta').textContent='浏览器无法播放此格式，可下载后用支持 WebM 的播放器查看。'};document.querySelectorAll('button').forEach(b=>b.onclick=()=>{v.currentTime=Number(b.dataset.time);v.pause()});</script></body></html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水畔 · 3× 原尺寸核验</title><style>body{margin:20px;font:15px/1.7 system-ui;background:#edeaf0;color:#30384b}h1{font-size:22px}p{max-width:65ch}iframe{display:block;width:390px;height:844px;border:0;max-width:none;transform-origin:top left}#frame-wrap{overflow:hidden}a{color:#654657;text-underline-offset:4px}:focus-visible{outline:2px solid #8f5367;outline-offset:3px}</style></head><body><h1>水畔 · 3× 原尺寸核验</h1><p>下面以 390×844 的页面尺寸、3× 画布运行同一套花园代码。菜单可导出 1170×2532 PNG，未经缩小。它是网页渲染核验，不是 iPhone 真机截屏；正文控件的实际外观另看网页截图。</p><p><a href="/">回到正常预览</a></p><div id="frame-wrap"><iframe title="3倍清晰度水畔" src="/?quality=3x"></iframe></div><script>const frame=document.querySelector("iframe"),wrap=document.querySelector("#frame-wrap");function fit(){const scale=Math.min(1,(innerWidth-40)/390,Math.max(300,innerHeight-230)/844);frame.style.transform=`scale(${scale})`;wrap.style.width=390*scale+"px";wrap.style.height=844*scale+"px"}addEventListener("resize",fit);fit();</script></body></html>

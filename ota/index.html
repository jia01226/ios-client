<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101733">
  <title>安装柯</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
      background: #0e1430;
      color: #f6f1e8;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(circle at 18% 20%, rgba(217,174,95,.18), transparent 28%),
        radial-gradient(circle at 82% 12%, rgba(107,122,194,.22), transparent 30%),
        linear-gradient(155deg, #172046 0%, #0e1430 58%, #17122d 100%);
    }
    main {
      width: min(100%, 420px);
      padding: 32px 26px 26px;
      border: 1px solid rgba(217,174,95,.3);
      border-radius: 28px;
      background: rgba(20,28,61,.74);
      box-shadow: 0 24px 70px rgba(0,0,0,.34);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .star { color: #d9ae5f; font-size: 22px; letter-spacing: 8px; }
    h1 { margin: 18px 0 8px; font-size: 34px; font-weight: 650; letter-spacing: .08em; }
    p { margin: 0; color: #b9c0db; font-size: 15px; line-height: 1.75; }
    .install {
      display: block;
      margin-top: 28px;
      padding: 16px 20px;
      border-radius: 18px;
      background: #d9ae5f;
      color: #101733;
      text-align: center;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(217,174,95,.2);
    }
    .notes {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid rgba(217,174,95,.18);
      color: #929bbb;
      font-size: 13px;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main>
    <div class="star">✦ ✧ ✦</div>
    <h1>柯</h1>
    <p>第一台真机测试包。用这台已经登记的 iPhone，在 Safari 里点下面的按钮。</p>
    <a class="install" href="itms-services://?action=download-manifest&amp;url=https%3A%2F%2Fjiagude.love%2Fios%2F2c9715755397490791ffbe1568d2b914%2Fmanifest.plist">安装柯</a>
    <div class="notes">点“安装”后回到桌面等待即可。不要使用微信内置浏览器，也不要直接下载 IPA。</div>
  </main>
</body>
</html>

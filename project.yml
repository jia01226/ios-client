name: KeApp

options:
  createIntermediateGroups: true
  groupSortPosition: top
  projectFormat: xcode15_3
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "2"
    MARKETING_VERSION: "0.1.0"

packages:
  EventSource:
    url: https://github.com/Recouse/EventSource.git
    exactVersion: 0.1.8

targets:
  KeApp:
    type: application
    platform: iOS
    sources:
      - path: KeApp
    info:
      path: KeApp/Info.plist
      properties:
        CFBundleDisplayName: 柯
        APIBaseURL: https://jiagude.love
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIAppFonts:
          - Allura-Regular.ttf
        LSRequiresIPhoneOS: true
        NSFaceIDUsageDescription: 用于打开只有你能进入的私密空间
        NSCameraUsageDescription: 用于拍照并把你选择的照片发送给柯
        NSPhotoLibraryUsageDescription: 用于选择你想发送给柯的照片
        NSLocationWhenInUseUsageDescription: 用于让柯知道你到了哪里和那边的天气，只在位置明显变化时更新
        NSLocationAlwaysAndWhenInUseUsageDescription: 用于在你到达新地方时安静更新给柯，不持续追踪路线
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: love.jiagude.ke
        PRODUCT_NAME: 柯
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: KeApp/KeApp.entitlements
    dependencies:
      - package: EventSource
    scheme:
      gatherCoverageData: false
      testTargets:
        - KeAppTests
        - KeAppUITests

  KeAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KeAppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: love.jiagude.ke.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/柯.app/柯"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: KeApp

  KeAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KeAppUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: love.jiagude.ke.uitests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: KeApp

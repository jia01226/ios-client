name: Verify iOS Simulator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # macos-15 的轻量镜像目前只带编译 SDK，没有预装 iOS Simulator runtime。
    # macos-14 自带可启动的 iOS 17 runtime，正好覆盖本项目最低系统版本。
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 选择带 Swift 6 与 iOS 18 模拟器的 Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate --spec project.yml

      - name: 模拟器核验聊天与我们页交互
        run: |
          set -euo pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          iphones = [
              device["udid"]
              for runtime in devices.values()
              for device in runtime
              if device.get("isAvailable") and device.get("name", "").startswith("iPhone")
          ]
          if not iphones:
              raise SystemExit("没有可用的 iPhone 模拟器")
          print(iphones[0])
          ')
          echo "使用模拟器 $SIMULATOR_ID"
          xcodebuild test \
            -project KeApp.xcodeproj \
            -scheme KeApp \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -resultBundlePath "$RUNNER_TEMP/iOSSimulator.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: 导出 UI 核验截图
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/iOSSimulator-screenshots"
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/iOSSimulator.xcresult" \
            --output-path "$RUNNER_TEMP/iOSSimulator-screenshots"
          test -n "$(find "$RUNNER_TEMP/iOSSimulator-screenshots" -type f -name '*.png' -print -quit)"

      - name: 上传 UI 核验截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOSSimulator-screenshots
          path: ${{ runner.temp }}/iOSSimulator-screenshots
          retention-days: 14

      - name: 上传模拟器核验记录
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOSSimulator-xcresult
          path: ${{ runner.temp }}/iOSSimulator.xcresult
          retention-days: 14

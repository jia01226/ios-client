name: Verify iOS Simulator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # 花园界面使用 Xcode 27 的 Liquid Glass API，需要对应工具链与模拟器。
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 查看 Xcode 27 与模拟器环境
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate --spec project.yml

      - name: 模拟器核验聊天与我们页交互
        run: |
          set -euo pipefail
          SIMULATOR_ID=$(python3 - <<'PYCODE'
          import json, subprocess
          def read(*args): return json.loads(subprocess.check_output(["xcrun", "simctl", "list", *args, "-j"]))
          runtimes = [r for r in read("runtimes")["runtimes"] if r.get("isAvailable") and ".iOS-" in r["identifier"]]
          runtime = max(runtimes, key=lambda r: tuple(map(int, r["version"].split("."))))
          devices = read("devices")["devices"].get(runtime["identifier"], [])
          matching = [d for d in devices if d.get("isAvailable") and d["name"] == "iPhone 14 Pro Max"]
          if matching: print(matching[0]["udid"])
          else:
              print(subprocess.check_output(["xcrun", "simctl", "create", "iPhone 14 Pro Max", "com.apple.CoreSimulator.SimDeviceType.iPhone-14-Pro-Max", runtime["identifier"]], text=True).strip())
          PYCODE
          )
          echo "使用模拟器 $SIMULATOR_ID"
          xcodebuild test \
            -project KeApp.xcodeproj \
            -scheme KeApp \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -resultBundlePath "$RUNNER_TEMP/iOSSimulator.xcresult" \
            -only-testing:KeAppTests \
            -only-testing:KeAppUITests/MoonlightInteractionTests \
            -only-testing:KeAppUITests/RootTabBarTests \
            CODE_SIGNING_ALLOWED=NO

      - name: 导出 UI 核验截图
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/iOSSimulator-screenshots"
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/iOSSimulator.xcresult" \
            --output-path "$RUNNER_TEMP/iOSSimulator-screenshots"
          test -n "$(find "$RUNNER_TEMP/iOSSimulator-screenshots" -type f -name '*.png' -print -quit)"

      - name: 上传 UI 核验截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOSSimulator-screenshots
          path: ${{ runner.temp }}/iOSSimulator-screenshots
          retention-days: 14

      - name: 上传模拟器核验记录
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOSSimulator-xcresult
          path: ${{ runner.temp }}/iOSSimulator.xcresult
          retention-days: 14

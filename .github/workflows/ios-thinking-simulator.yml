name: Verify Thinking Simulator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # macos-15 的轻量镜像目前只带编译 SDK，没有预装 iOS Simulator runtime。
    # macos-14 自带可启动的 iOS 17 runtime，正好覆盖本项目最低系统版本。
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate --spec project.yml

      - name: 模拟器核验 Thinking 三态
        run: |
          set -euo pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          iphones = [
              device["udid"]
              for runtime in devices.values()
              for device in runtime
              if device.get("isAvailable") and device.get("name", "").startswith("iPhone")
          ]
          if not iphones:
              raise SystemExit("没有可用的 iPhone 模拟器")
          print(iphones[0])
          ')
          echo "使用模拟器 $SIMULATOR_ID"
          xcodebuild test \
            -project KeApp.xcodeproj \
            -scheme KeApp \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -resultBundlePath "$RUNNER_TEMP/ThinkingSimulator.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: 上传模拟器核验记录
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ThinkingSimulator-xcresult
          path: ${{ runner.temp }}/ThinkingSimulator.xcresult
          retention-days: 14

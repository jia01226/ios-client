name: Build TestFlight

on:
  # 只手动触发：App Store Connect 有上传频率限制
  # 临时：新工作流在默认分支登记前，dispatch 端点找不到它，用一次性触发分支跑
  push:
    branches:
      - claude/tf-trigger
  workflow_dispatch:
    inputs:
      build_number:
        description: "可选：指定 Build 号；留空用工作流运行序号"
        required: false
        type: string
      include_watch:
        description: "是否带手表 KeWatch"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  testflight:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      BUNDLE_ID: love.jiagude.ke
      TEAM_ID: 527CR3MRV2
      PROJECT: KeApp.xcodeproj
      SCHEME: KeApp
      # push 触发拿不到 inputs，这里给一个固定 Build 号；换成 workflow_dispatch 后可删
      DEFAULT_BUILD_NUMBER: 207
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      PHONE_APPSTORE_PROFILE_BASE64: ${{ secrets.PHONE_APPSTORE_PROFILE_BASE64 }}
      WATCH_APPSTORE_PROFILE_BASE64: ${{ secrets.WATCH_APPSTORE_PROFILE_BASE64 }}

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 查看云端工具版本
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun altool --version || true

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        env:
          INCLUDE_WATCH: ${{ inputs.include_watch }}
        run: |
          set -euo pipefail
          if [ "${INCLUDE_WATCH:-true}" = "false" ]; then
            echo "本次不打手表"
            python3 scripts/remove-watch.py
          fi
          xcodegen generate --spec project.yml
          test -d "$PROJECT"

      - name: 安装发布证书和 App Store 描述文件
        env:
          INCLUDE_WATCH: ${{ inputs.include_watch }}
        run: |
          set -euo pipefail
          : "${BUILD_CERTIFICATE_BASE64:?缺少 BUILD_CERTIFICATE_BASE64}"
          : "${P12_PASSWORD:?缺少 P12_PASSWORD}"
          : "${PHONE_APPSTORE_PROFILE_BASE64:?缺少 PHONE_APPSTORE_PROFILE_BASE64（love.jiagude.ke 的 App Store 描述文件）}"

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          install_profile() {
            local b64="$1" expected="$2" label="$3"
            local path="$RUNNER_TEMP/$label.mobileprovision"
            local plist="$RUNNER_TEMP/$label.plist"
            printf '%s' "$b64" | base64 --decode > "$path"
            security cms -D -i "$path" > "$plist"
            local uuid name appid
            uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist")
            name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist")
            appid=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$plist")
            test "$appid" = "$TEAM_ID.$expected"
            cp "$path" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
            echo "${label}_NAME=$name" >> "$GITHUB_ENV"
            echo "装好描述文件：$name ($expected)"
          }
          install_profile "$PHONE_APPSTORE_PROFILE_BASE64" "$BUNDLE_ID" "PHONE"

          if [ "${INCLUDE_WATCH:-true}" != "false" ]; then
            : "${WATCH_APPSTORE_PROFILE_BASE64:?缺少 WATCH_APPSTORE_PROFILE_BASE64（手表 App Store 描述文件）}"
            install_profile "$WATCH_APPSTORE_PROFILE_BASE64" "$BUNDLE_ID.watchkitapp" "WATCH"
          fi

      - name: 准备 App Store Connect API Key（只用来上传）
        run: |
          set -euo pipefail
          : "${ASC_KEY_ID:?缺少 ASC_KEY_ID}"
          : "${ASC_ISSUER_ID:?缺少 ASC_ISSUER_ID}"
          : "${ASC_KEY_BASE64:?缺少 ASC_KEY_BASE64}"
          mkdir -p "$HOME/private_keys"
          KEY_PATH="$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

      - name: Archive（手动签名）
        run: |
          set -euo pipefail
          BUILD_NUMBER="${{ inputs.build_number }}"
          if [ -z "$BUILD_NUMBER" ]; then BUILD_NUMBER="${DEFAULT_BUILD_NUMBER:-$GITHUB_RUN_NUMBER}"; fi
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/KeApp.xcarchive" \
            -destination 'generic/platform=iOS' \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            KE_PHONE_PROFILE="$PHONE_NAME" \
            ${WATCH_NAME:+KE_WATCH_PROFILE="$WATCH_NAME"} \
            archive

      - name: 导出 App Store 包
        run: |
          set -euo pipefail
          EXPORT_METHOD=app-store-connect EXPORT_SIGNING=manual \
            PROFILE_NAME="$PHONE_NAME" WATCH_PROFILE_NAME="${WATCH_NAME:-}" \
            python3 scripts/export-options.py "$RUNNER_TEMP/ExportOptions.plist"
          cat "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/KeApp.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: 上传到 App Store Connect
        run: |
          set -euo pipefail
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          echo "IPA: $IPA"
          if xcrun altool --version >/dev/null 2>&1; then
            xcrun altool --upload-app --type ios --file "$IPA" \
              --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          else
            xcrun iTMSTransporter -m upload -assetFile "$IPA" \
              -apiKey "$ASC_KEY_ID" -apiIssuer "$ASC_ISSUER_ID" -v informational
          fi

      - name: 归档产物
        uses: actions/upload-artifact@v4
        with:
          name: KeApp-testflight-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 7

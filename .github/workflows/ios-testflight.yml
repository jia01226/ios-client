name: Build TestFlight

on:
  # 只手动触发：Apple 的 App Store Connect 有上传频率限制
  workflow_dispatch:
    inputs:
      build_number:
        description: "可选：指定 Build 号；留空用工作流运行序号"
        required: false
        type: string
      include_watch:
        description: "是否带手表 KeWatch"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  testflight:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      BUNDLE_ID: love.jiagude.ke
      TEAM_ID: 527CR3MRV2
      PROJECT: KeApp.xcodeproj
      SCHEME: KeApp
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 查看云端工具版本
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun altool --version || true

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        env:
          INCLUDE_WATCH: ${{ inputs.include_watch }}
        run: |
          set -euo pipefail
          if [ "${INCLUDE_WATCH:-true}" = "false" ]; then
            echo "本次不打手表"
            python3 scripts/remove-watch.py
          fi
          xcodegen generate --spec project.yml
          test -d "$PROJECT"

      - name: 准备 App Store Connect API Key
        run: |
          set -euo pipefail
          : "${ASC_KEY_ID:?缺少 ASC_KEY_ID}"
          : "${ASC_ISSUER_ID:?缺少 ASC_ISSUER_ID}"
          : "${ASC_KEY_BASE64:?缺少 ASC_KEY_BASE64}"
          mkdir -p "$HOME/private_keys"
          KEY_PATH="$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "AUTH_ARGS=-authenticationKeyPath $KEY_PATH -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Archive（自动签名）
        run: |
          set -euo pipefail
          BUILD_NUMBER="${{ inputs.build_number }}"
          if [ -z "$BUILD_NUMBER" ]; then BUILD_NUMBER="$GITHUB_RUN_NUMBER"; fi
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          # shellcheck disable=SC2086
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/KeApp.xcarchive" \
            -destination 'generic/platform=iOS' \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            $AUTH_ARGS \
            archive

      - name: 导出 App Store 包
        run: |
          set -euo pipefail
          EXPORT_METHOD=app-store-connect EXPORT_SIGNING=automatic \
            python3 scripts/export-options.py "$RUNNER_TEMP/ExportOptions.plist"
          # shellcheck disable=SC2086
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/KeApp.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            $AUTH_ARGS

      - name: 上传到 App Store Connect
        run: |
          set -euo pipefail
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          echo "IPA: $IPA"
          if xcrun altool --version >/dev/null 2>&1; then
            xcrun altool --upload-app --type ios --file "$IPA" \
              --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          else
            # 新版 Xcode 没 altool 时走 Transporter
            xcrun iTMSTransporter -m upload -assetFile "$IPA" \
              -apiKey "$ASC_KEY_ID" -apiIssuer "$ASC_ISSUER_ID" -v informational
          fi

      - name: 归档产物（可选下载）
        uses: actions/upload-artifact@v4
        with:
          name: KeApp-testflight-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 7
